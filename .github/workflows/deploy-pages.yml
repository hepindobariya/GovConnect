name: Deploy Landing Page

on:
  push:
    branches:
      - main
    paths:
      - 'landing_page/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: landing_page
          branch: gh-pages
